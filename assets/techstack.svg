<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#080B12"/>
      <stop offset="100%" style="stop-color:#0D1526"/>
    </linearGradient>
  </defs>

  <rect width="900" height="100" fill="url(#tbg)" rx="10"/>
  <rect x="0" y="0" width="900" height="2" rx="1" fill="#FF5722" opacity="0.6"/>

  <!-- HTML5 -->
  <rect x="30" y="22" width="110" height="56" rx="8" fill="#1A1F2E" stroke="#E44D26" stroke-width="1.5"/>
  <text x="85" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🟠</text>
  <text x="85" y="67" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E44D26" text-anchor="middle">HTML5</text>

  <!-- CSS3 -->
  <rect x="155" y="22" width="110" height="56" rx="8" fill="#1A1F2E" stroke="#264DE4" stroke-width="1.5"/>
  <text x="210" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🔵</text>
  <text x="210" y="67" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#264DE4" text-anchor="middle">CSS3</text>

  <!-- JavaScript -->
  <rect x="280" y="22" width="110" height="56" rx="8" fill="#1A1F2E" stroke="#F7DF1E" stroke-width="1.5"/>
  <text x="335" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🟡</text>
  <text x="335" y="67" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#F7DF1E" text-anchor="middle">JavaScript</text>

  <!-- Node.js -->
  <rect x="405" y="22" width="110" height="56" rx="8" fill="#1A1F2E" stroke="#339933" stroke-width="1.5"/>
  <text x="460" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🟢</text>
  <text x="460" y="67" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#339933" text-anchor="middle">Node.js</text>

  <!-- Express -->
  <rect x="530" y="22" width="110" height="56" rx="8" fill="#1A1F2E" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="585" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">⚡</text>
  <text x="585" y="67" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#AAAAAA" text-anchor="middle">Express.js</text>

  <!-- Gemini AI -->
  <rect x="655" y="22" width="110" height="56" rx="8" fill="#1A1F2E" stroke="#7C5CFC" stroke-width="1.5"/>
  <text x="710" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">✨</text>
  <text x="710" y="67" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7C5CFC" text-anchor="middle">Gemini AI</text>

  <!-- Google Fonts -->
  <rect x="780" y="22" width="90" height="56" rx="8" fill="#1A1F2E" stroke="#4285F4" stroke-width="1.5"/>
  <text x="825" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🅶</text>
  <text x="825" y="67" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4285F4" text-anchor="middle">G Fonts</text>

  <rect x="0" y="98" width="900" height="2" rx="1" fill="#00C896" opacity="0.6"/>
</svg>
