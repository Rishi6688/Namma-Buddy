<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080B12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1526;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0F1E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5A623;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B8D9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGrad)" rx="12"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="70" x2="900" y2="70" stroke="#1A2035" stroke-width="1"/>
  <line x1="0" y1="140" x2="900" y2="140" stroke="#1A2035" stroke-width="1"/>
  <line x1="0" y1="210" x2="900" y2="210" stroke="#1A2035" stroke-width="1"/>
  <line x1="180" y1="0" x2="180" y2="280" stroke="#1A2035" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="280" stroke="#1A2035" stroke-width="1"/>
  <line x1="540" y1="0" x2="540" y2="280" stroke="#1A2035" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="280" stroke="#1A2035" stroke-width="1"/>

  <!-- Glow orbs -->
  <circle cx="150" cy="140" r="90" fill="#FF5722" opacity="0.06"/>
  <circle cx="750" cy="140" r="90" fill="#7C5CFC" opacity="0.07"/>
  <circle cx="450" cy="60" r="60" fill="#00C896" opacity="0.05"/>

  <!-- Orange accent line top -->
  <rect x="0" y="0" width="900" height="3" fill="url(#orangeGrad)" rx="0"/>

  <!-- Logo circle -->
  <circle cx="110" cy="140" r="52" fill="#FF5722" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="110" cy="140" r="44" fill="none" stroke="url(#orangeGrad)" stroke-width="2"/>
  <text x="110" y="130" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#orangeGrad)" text-anchor="middle" filter="url(#glow)">NB</text>
  <text x="110" y="157" font-family="Arial, sans-serif" font-size="9" fill="#F5A623" text-anchor="middle" letter-spacing="2">NAMMA</text>

  <!-- Main Title -->
  <text x="210" y="118" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="#EEF2FF" letter-spacing="-1">Namma</text>
  <text x="210" y="168" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#orangeGrad)" filter="url(#glow)" letter-spacing="-1">Buddy</text>

  <!-- Tagline -->
  <text x="210" y="196" font-family="Arial, sans-serif" font-size="14" fill="#8892B0" letter-spacing="1">YOUR SMART BANGALORE COMPANION</text>

  <!-- Divider line -->
  <rect x="210" y="208" width="60" height="2" fill="url(#orangeGrad)" rx="1"/>

  <!-- Feature pills - right side -->
  <!-- Metro -->
  <rect x="530" y="58" width="130" height="30" rx="15" fill="#1A2035" stroke="#FF5722" stroke-width="1"/>
  <text x="595" y="78" font-family="Arial, sans-serif" font-size="12" fill="#FF5722" text-anchor="middle">🚇 Metro Nav</text>

  <!-- Food -->
  <rect x="680" y="58" width="120" height="30" rx="15" fill="#1A2035" stroke="#F5A623" stroke-width="1"/>
  <text x="740" y="78" font-family="Arial, sans-serif" font-size="12" fill="#F5A623" text-anchor="middle">🍛 Food</text>

  <!-- AI -->
  <rect x="530" y="100" width="120" height="30" rx="15" fill="#1A2035" stroke="#7C5CFC" stroke-width="1"/>
  <text x="590" y="120" font-family="Arial, sans-serif" font-size="12" fill="#7C5CFC" text-anchor="middle">🤖 AI Buddy</text>

  <!-- Language -->
  <rect x="662" y="100" width="140" height="30" rx="15" fill="#1A2035" stroke="#00C896" stroke-width="1"/>
  <text x="732" y="120" font-family="Arial, sans-serif" font-size="12" fill="#00C896" text-anchor="middle">🗣️ Kannada</text>

  <!-- Emergency -->
  <rect x="530" y="142" width="140" height="30" rx="15" fill="#1A2035" stroke="#FF4757" stroke-width="1"/>
  <text x="600" y="162" font-family="Arial, sans-serif" font-size="12" fill="#FF4757" text-anchor="middle">🚨 Emergency</text>

  <!-- Stay -->
  <rect x="682" y="142" width="120" height="30" rx="15" fill="#1A2035" stroke="#00B8D9" stroke-width="1"/>
  <text x="742" y="162" font-family="Arial, sans-serif" font-size="12" fill="#00B8D9" text-anchor="middle">🏠 Stay</text>

  <!-- Rides -->
  <rect x="530" y="184" width="120" height="30" rx="15" fill="#1A2035" stroke="#F5A623" stroke-width="1"/>
  <text x="590" y="204" font-family="Arial, sans-serif" font-size="12" fill="#F5A623" text-anchor="middle">🚗 Rides</text>

  <!-- Gemini -->
  <rect x="662" y="184" width="140" height="30" rx="15" fill="#1A2035" stroke="#7C5CFC" stroke-width="1"/>
  <text x="732" y="204" font-family="Arial, sans-serif" font-size="12" fill="#7C5CFC" text-anchor="middle">✨ Gemini AI</text>

  <!-- Bottom stat bar -->
  <rect x="30" y="235" width="840" height="1" fill="#1A2035"/>
  <text x="210" y="258" font-family="Arial, sans-serif" font-size="11" fill="#4A5568">9 Screens</text>
  <text x="310" y="258" font-family="Arial, sans-serif" font-size="11" fill="#4A5568">50+ Stations</text>
  <text x="420" y="258" font-family="Arial, sans-serif" font-size="11" fill="#4A5568">100+ Phrases</text>
  <text x="540" y="258" font-family="Arial, sans-serif" font-size="11" fill="#4A5568">Gemini 1.5 Flash</text>
  <text x="680" y="258" font-family="Arial, sans-serif" font-size="11" fill="#4A5568">Mobile First</text>

  <!-- Bottom accent line -->
  <rect x="0" y="277" width="900" height="3" fill="url(#greenGrad)" rx="0"/>
</svg>
